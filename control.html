<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 实时控制</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #f1f5f9; }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ef4444; transition: background 0.3s;
    }
    .dot.online { background: #22c55e; }

    /* LED 状态实时监控 */
    .led-monitor {
      margin-bottom: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .led-monitor .label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .led-monitor .value {
      font-size: 28px;
      font-weight: 700;
      transition: color 0.3s;
    }
    .led-monitor .value.on  { color: #22c55e; }
    .led-monitor .value.off { color: #ef4444; }
    .led-monitor .value.unknown { color: #64748b; }

    /* 单个开关按钮 */
    .switch-btn {
      width: 100%;
      padding: 24px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      color: #fff;
      background: #475569;
    }
    .switch-btn:active { transform: scale(0.97); }
    .switch-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .switch-btn.on  { background: #16a34a; }
    .switch-btn.off { background: #dc2626; }

    .log {
      margin-top: 24px;
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
      color: #94a3b8;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      border: 1px solid #334155;
    }
    .log div { margin-bottom: 4px; }
    .log .time { color: #475569; margin-right: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ESP32 实时控制</h1>

    <div class="status-bar">
      <span class="dot" id="connDot"></span>
      <span id="connText">未连接</span>
    </div>

    <!-- LED 实时状态 -->
    <div class="led-monitor">
      <div class="label">LED 当前状态</div>
      <div class="value unknown" id="ledState">未知</div>
    </div>

    <!-- 单个开关按钮 -->
    <button class="switch-btn" id="switchBtn" onclick="toggleLED()" disabled>
      连接中...
    </button>

    <div class="log" id="log"></div>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    // ===== 改这里：和 ESP32 代码里的主题完全一致 =====
    const TOPIC_CMD    = 'esp32/Senva/cmd';
    const TOPIC_STATUS = 'esp32/Senva/status';
    // =================================================

    const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

    const client = mqtt.connect(BROKER_URL, {
      clientId: 'web_' + Math.random().toString(16).substr(2, 8),
      clean: true,
      reconnectPeriod: 3000
    });

    const dot       = document.getElementById('connDot');
    const connText  = document.getElementById('connText');
    const logBox    = document.getElementById('log');
    const ledState  = document.getElementById('ledState');
    const switchBtn = document.getElementById('switchBtn');

    // 本地记录当前 LED 状态，用于切换按钮文字
    let currentLED = null;   // null=未知, true=开, false=关

    function addLog(msg) {
      const t = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.innerHTML = `<span class="time">${t}</span>${msg}`;
      logBox.prepend(div);
      while (logBox.children.length > 15) logBox.removeChild(logBox.lastChild);
    }

    // 根据 LED 状态更新界面
    function updateLEDState(isOn) {
      currentLED = isOn;

      if (isOn === null) {
        ledState.textContent = '未知';
        ledState.className = 'value unknown';
        switchBtn.textContent = '连接中...';
        switchBtn.className = 'switch-btn';
        return;
      }

      if (isOn) {
        ledState.textContent = '已开启';
        ledState.className = 'value on';
        switchBtn.textContent = '关灯';
        switchBtn.className = 'switch-btn on';
      } else {
        ledState.textContent = '已关闭';
        ledState.className = 'value off';
        switchBtn.textContent = '开灯';
        switchBtn.className = 'switch-btn off';
      }
    }

    // 连接成功
    client.on('connect', () => {
      dot.classList.add('online');
      connText.textContent = '已连接';
      switchBtn.disabled = false;
      client.subscribe(TOPIC_STATUS);
      client.publish(TOPIC_CMD, 'status');   // 主动查询一次当前状态
      addLog('已连接，查询当前状态');
    });

    client.on('reconnect', () => {
      connText.textContent = '重连中...';
      dot.classList.remove('online');
    });

    client.on('close', () => {
      dot.classList.remove('online');
      connText.textContent = '已断开';
      switchBtn.disabled = true;
      updateLEDState(null);
    });

    // 收到 ESP32 上报的状态
    client.on('message', (topic, payload) => {
      const msg = payload.toString();
      addLog(`收到 [${topic}] : ${msg}`);

      if (topic === TOPIC_STATUS) {
        if (msg === 'on') {
          updateLEDState(true);
        } else if (msg === 'off') {
          updateLEDState(false);
        }
        // 如果后面要发 JSON 数据，在这里加 JSON.parse 分支
      }
    });

    // 单个开关按钮：根据当前状态发送相反指令
    function toggleLED() {
      if (!client.connected) {
        addLog('未连接，无法发送');
        return;
      }
      if (currentLED === null) {
        addLog('状态未知，先查询');
        client.publish(TOPIC_CMD, 'status');
        return;
      }

      const cmd = currentLED ? 'off' : 'on';   // 当前是开就发关，反之亦然
      client.publish(TOPIC_CMD, cmd, { qos: 0 });
      addLog('发送指令: ' + cmd);
      // 不立即改界面，等 ESP32 上报后由 updateLEDState 更新
    }
  </script>

</body>
</html>
