<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>用电器识别装置</title>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5e9c8;
    color: #2b2416;
  }

  h2 { color: #6b5416; margin-top: 0; }

  .layout {
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }

  .left-col { flex: 1 1 auto; min-width: 0; }

  .right-col {
    flex: 0 0 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }

  .card {
    background: #fffef7;
    border: 1px solid #d8c48a;
    border-radius: 10px;
    padding: 18px 22px;
    flex: 1 1 260px;
    min-width: 260px;
    box-shadow: 0 3px 8px rgba(120, 95, 30, .2);
  }

  .card h3 {
    margin: 0 0 12px;
    font-size: 18px;
    color: #6b5416;
    border-bottom: 1px solid #e8d9a8;
    padding-bottom: 6px;
  }

  /* 每一项：左边标签，右边数值 + 下方单位 */
  .item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 0;
    border-bottom: 1px dashed #efe3bf;
  }

  .item:last-child { border-bottom: none; }

  .item .label {
    font-size: 16px;
    color: #8a7650;
    line-height: 1.4;
  }

  .item .value-wrap {
    text-align: right;
    line-height: 1.2;
  }

  .item .value {
    font-size: 18px;
    font-weight: 700;
    color: #2b2416;
  }

  .item .unit {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: #b8a678;
    margin-top: 2px;
  }

  .panel {
    background: #fffef7;
    border: 1px solid #d8c48a;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(120, 95, 30, .18);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: #6b5416;
    border-left: 4px solid #d4a62a;
    padding-left: 8px;
  }

  button {
    padding: 6px 14px;
    margin-right: 8px;
    border: 1px solid #c9a94e;
    border-radius: 4px;
    background: #f7e6a8;
    color: #5a4612;
    cursor: pointer;
    transition: background .15s;
  }

  button:hover { background: #efd886; }

  .log-panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 420px;
  }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    font-size: 13px;
    font-family: monospace;
    background: #fffdf2;
    padding: 8px;
    border: 1px solid #d8c48a;
    border-radius: 4px;
    color: #4a3f28;
  }

  #log div { line-height: 1.6; }

  .status { font-size: 12px; color: #7a6636; margin-bottom: 12px; }

  #learnedList { font-size: 14px; color: #3d3420; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .right-col { flex: 1 1 auto; width: 100%; }
  }
</style>
</head>
<body>

<h2>用电器识别装置</h2>
<div class="status" id="connStatus">MQTT 未连接</div>

<div class="layout">
  <div class="left-col">
    <div class="grid" id="deviceGrid"></div>

    <div class="panel">
      <h2>已学习用电器</h2>
      <div id="learnedList">（暂无）</div>
      <button onclick="sendCtrl({cmd:'clear_learned'})">清除学习记录</button>
    </div>

    <div class="panel">
      <h2>模式</h2>
      <div id="modeDisplay">当前模式：未知</div>
      <button onclick="sendCtrl({cmd:'set_mode', value:'learn'})">学习模式</button>
      <button onclick="sendCtrl({cmd:'set_mode', value:'recognize'})">识别模式</button>
    </div>

    <div class="panel">
      <h2>模块控制</h2>
      <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:1})">语音开</button>
      <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:0})">语音关</button>
    </div>
  </div>

  <div class="right-col">
    <div class="panel log-panel">
      <h2>日志</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const clientId = 'web_senva_' + Math.random().toString(16).substring(2, 8);
const topicData = 'esp32/Senva/data';
const topicCtrl = 'esp32/Senva/ctrl';

const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
  clientId: clientId,
  clean: true,
  connectTimeout: 4000
});

const deviceGrid = document.getElementById('deviceGrid');
const learnedList = document.getElementById('learnedList');
const logBox = document.getElementById('log');
const connStatus = document.getElementById('connStatus');
const modeDisplay = document.getElementById('modeDisplay');

let prevIds = new Set();

client.on('connect', () => {
  connStatus.textContent = 'MQTT 已连接';
  client.subscribe(topicData, { qos: 0 });
  addLog('MQTT 已连接，订阅 ' + topicData);
});

client.on('error', (err) => {
  connStatus.textContent = 'MQTT 连接失败';
  addLog('MQTT 错误: ' + err.message);
});

client.on('message', (topic, payload) => {
  if (topic !== topicData) return;
  let data;
  try {
    data = JSON.parse(payload.toString());
  } catch (e) {
    addLog('JSON 解析失败: ' + payload.toString());
    return;
  }
  renderDevices(data.devices || []);
  renderLearned(data.learned || []);
  if (data.mode !== undefined) {
    modeDisplay.textContent = '当前模式：' + data.mode;
  }
});

function renderDevices(devices) {
  const currentIds = new Set(devices.map(d => d.id));

  prevIds.forEach(id => {
    if (!currentIds.has(id)) addLog('用电器 ' + id + ' 停止使用');
  });
  currentIds.forEach(id => {
    if (!prevIds.has(id)) addLog('用电器 ' + id + ' 开始使用');
  });
  prevIds = currentIds;

  deviceGrid.innerHTML = '';
  devices.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>用电器 ${d.id}</h3>
      <div class="item">
        <span class="label">电流</span>
        <span class="value-wrap">
          <span class="value">${d.i}</span>
          <span class="unit">A</span>
        </span>
      </div>
      <div class="item">
        <span class="label">电压</span>
        <span class="value-wrap">
          <span class="value">${d.v}</span>
          <span class="unit">V</span>
        </span>
      </div>
      <div class="item">
        <span class="label">功率</span>
        <span class="value-wrap">
          <span class="value">${d.p}</span>
          <span class="unit">W</span>
        </span>
      </div>
      <div class="item">
        <span class="label">相位</span>
        <span class="value-wrap">
          <span class="value">${d.phase}</span>
          <span class="unit">°</span>
        </span>
      </div>
    `;
    deviceGrid.appendChild(card);
  });
}

function renderLearned(list) {
  if (!list.length) {
    learnedList.textContent = '（暂无）';
  } else {
    learnedList.textContent = '编号: ' + list.join(', ');
  }
}

function sendCtrl(obj) {
  const msg = JSON.stringify(obj);
  client.publish(topicCtrl, msg, { qos: 0 });
  addLog('发送控制: ' + msg);
}

function addLog(text) {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.textContent = '[' + time + '] ' + text;
  logBox.prepend(div);
  while (logBox.children.length > 200) logBox.removeChild(logBox.lastChild);
}
</script>

</body>
</html>
