<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>电赛H题 用电器监控</title>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5e9c8;
    color: #2b2416;
  }

  h2 { color: #6b5416; }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  .card {
    background: #fffef7;
    border: 1px solid #d8c48a;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 190px;
    box-shadow: 0 2px 6px rgba(120, 95, 30, .18);
  }

  .card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #6b5416;
    border-bottom: 1px solid #e8d9a8;
    padding-bottom: 4px;
  }

  .card .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    line-height: 1.8;
  }

  .card .row span:first-child { color: #8a7650; }
  .card .row span:last-child { color: #2b2416; font-weight: 600; }

  .panel {
    background: #fffef7;
    border: 1px solid #d8c48a;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(120, 95, 30, .18);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: #6b5416;
    border-left: 4px solid #d4a62a;
    padding-left: 8px;
  }

  button {
    padding: 6px 14px;
    margin-right: 8px;
    border: 1px solid #c9a94e;
    border-radius: 4px;
    background: #f7e6a8;
    color: #5a4612;
    cursor: pointer;
    transition: background .15s;
  }

  button:hover { background: #efd886; }

  #log {
    height: 140px;
    overflow-y: auto;
    font-size: 13px;
    font-family: monospace;
    background: #fffdf2;
    padding: 8px;
    border: 1px solid #d8c48a;
    border-radius: 4px;
    color: #4a3f28;
  }

  #log div { line-height: 1.6; }

  .status { font-size: 12px; color: #7a6636; }

  #learnedList { font-size: 14px; color: #3d3420; }
</style>
</head>
<body>

<h2>用电器监控</h2>
<div class="status" id="connStatus">MQTT 未连接</div>

<div class="grid" id="deviceGrid"></div>

<div class="panel">
  <h2>已学习用电器</h2>
  <div id="learnedList">（暂无）</div>
  <button onclick="sendCtrl({cmd:'clear_learned'})">清除学习记录</button>
</div>

<div class="panel">
  <h2>模式</h2>
  <div id="modeDisplay">当前模式：未知</div>
  <button onclick="sendCtrl({cmd:'set_mode', value:'learn'})">学习模式</button>
  <button onclick="sendCtrl({cmd:'set_mode', value:'recognize'})">识别模式</button>
</div>

<div class="panel">
  <h2>模块控制</h2>
  <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:1})">语音开</button>
  <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:0})">语音关</button>
</div>

<div class="panel">
  <h2>日志</h2>
  <div id="log"></div>
</div>

<script>
const clientId = 'web_senva_' + Math.random().toString(16).substring(2, 8);
const topicData = 'esp32/Senva/data';
const topicCtrl = 'esp32/Senva/ctrl';

const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
  clientId: clientId,
  clean: true,
  connectTimeout: 4000
});

const deviceGrid = document.getElementById('deviceGrid');
const learnedList = document.getElementById('learnedList');
const logBox = document.getElementById('log');
const connStatus = document.getElementById('connStatus');
const modeDisplay = document.getElementById('modeDisplay');

let prevIds = new Set();

client.on('connect', () => {
  connStatus.textContent = 'MQTT 已连接';
  client.subscribe(topicData, { qos: 0 });
  addLog('MQTT 已连接，订阅 ' + topicData);
});

client.on('error', (err) => {
  connStatus.textContent = 'MQTT 连接失败';
  addLog('MQTT 错误: ' + err.message);
});

client.on('message', (topic, payload) => {
  if (topic !== topicData) return;
  let data;
  try {
    data = JSON.parse(payload.toString());
  } catch (e) {
    addLog('JSON 解析失败: ' + payload.toString());
    return;
  }
  renderDevices(data.devices || []);
  renderLearned(data.learned || []);
  if (data.mode !== undefined) {
    modeDisplay.textContent = '当前模式：' + data.mode;
  }
});

function renderDevices(devices) {
  const currentIds = new Set(devices.map(d => d.id));

  prevIds.forEach(id => {
    if (!currentIds.has(id)) addLog('用电器 ' + id + ' 停止使用');
  });
  currentIds.forEach(id => {
    if (!prevIds.has(id)) addLog('用电器 ' + id + ' 开始使用');
  });
  prevIds = currentIds;

  // 按数据给的顺序渲染，有几个显示几个，不再固定槽位
  deviceGrid.innerHTML = '';
  devices.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>用电器 ${d.id}</h3>
      <div class="row"><span>电流</span><span>${d.i} A</span></div>
      <div class="row"><span>电压</span><span>${d.v} V</span></div>
      <div class="row"><span>功率</span><span>${d.p} W</span></div>
      <div class="row"><span>相位</span><span>${d.phase} °</span></div>
    `;
    deviceGrid.appendChild(card);
  });
}

function renderLearned(list) {
  if (!list.length) {
    learnedList.textContent = '（暂无）';
  } else {
    learnedList.textContent = '编号: ' + list.join(', ');
  }
}

function sendCtrl(obj) {
  const msg = JSON.stringify(obj);
  client.publish(topicCtrl, msg, { qos: 0 });
  addLog('发送控制: ' + msg);
}

function addLog(text) {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.textContent = '[' + time + '] ' + text;
  logBox.prepend(div);
  while (logBox.children.length > 200) logBox.removeChild(logBox.lastChild);
}
</script>

</body>
</html>
