<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>电赛H题 用电器监控</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
    background: #fffdf0;
    color: #333;
  }

  h2 { color: #8a6d1f; }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #f2e6b8;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 180px;
    box-shadow: 0 1px 4px rgba(210, 190, 120, .15);
  }

  .card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #8a6d1f;
    border-bottom: 1px solid #f5edcc;
    padding-bottom: 4px;
  }

  .card .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    line-height: 1.8;
  }

  .card .row span:first-child { color: #999; }
  .card .row span:last-child { color: #333; font-weight: 600; }

  .inactive { opacity: .4; }

  .panel {
    background: #ffffff;
    border: 1px solid #f2e6b8;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(210, 190, 120, .15);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: #8a6d1f;
    border-left: 4px solid #f0d060;
    padding-left: 8px;
  }

  button {
    padding: 6px 14px;
    margin-right: 8px;
    border: 1px solid #e6d488;
    border-radius: 4px;
    background: #fffbe8;
    color: #6b5416;
    cursor: pointer;
    transition: background .15s;
  }

  button:hover { background: #fdf2c4; }

  #log {
    height: 140px;
    overflow-y: auto;
    font-size: 13px;
    font-family: monospace;
    background: #fffdf5;
    padding: 8px;
    border: 1px solid #f2e6b8;
    border-radius: 4px;
    color: #555;
  }

  #log div { line-height: 1.6; }

  .status { font-size: 12px; color: #a8955a; }

  #learnedList { font-size: 14px; color: #444; }
</style>
</head>
<body>

<h2>用电器监控</h2>
<div class="status" id="connStatus">MQTT 未连接</div>

<!-- 用电器数据窗口 -->
<div class="grid" id="deviceGrid"></div>

<!-- 已学习记录 -->
<div class="panel">
  <h2>已学习用电器</h2>
  <div id="learnedList">（暂无）</div>
  <button onclick="sendCtrl({cmd:'clear_learned'})">清除学习记录</button>
</div>

<!-- 模式窗口 -->
<div class="panel">
  <h2>模式</h2>
  <div id="modeDisplay">当前模式：未知</div>
  <button onclick="sendCtrl({cmd:'set_mode', value:'learn'})">学习模式</button>
  <button onclick="sendCtrl({cmd:'set_mode', value:'recognize'})">识别模式</button>
</div>

<!-- 控制窗口 -->
<div class="panel">
  <h2>模块控制</h2>
  <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:1})">语音开</button>
  <button onclick="sendCtrl({cmd:'set_module', name:'voice', value:0})">语音关</button>
</div>

<!-- 日志窗口 -->
<div class="panel">
  <h2>日志</h2>
  <div id="log"></div>
</div>

<script>
const clientId = 'web_senva_' + Math.random().toString(16).substring(2, 8);
const topicData = 'esp32/Senva/data';
const topicCtrl = 'esp32/Senva/ctrl';

const client = mqtt.connect('ws://broker.emqx.io:8083/mqtt', {
  clientId: clientId,
  clean: true,
  connectTimeout: 4000
});

const deviceGrid = document.getElementById('deviceGrid');
const learnedList = document.getElementById('learnedList');
const logBox = document.getElementById('log');
const connStatus = document.getElementById('connStatus');
const modeDisplay = document.getElementById('modeDisplay');

let prevIds = new Set();
const MAX_SLOTS = 5;

client.on('connect', () => {
  connStatus.textContent = 'MQTT 已连接';
  client.subscribe(topicData, { qos: 0 });
  addLog('MQTT 已连接，订阅 ' + topicData);
});

client.on('error', (err) => {
  connStatus.textContent = 'MQTT 连接失败';
  addLog('MQTT 错误: ' + err.message);
});

client.on('message', (topic, payload) => {
  if (topic !== topicData) return;
  let data;
  try {
    data = JSON.parse(payload.toString());
  } catch (e) {
    addLog('JSON 解析失败: ' + payload.toString());
    return;
  }
  renderDevices(data.devices || []);
  renderLearned(data.learned || []);
  if (data.mode !== undefined) {
    modeDisplay.textContent = '当前模式：' + data.mode;
  }
});

function renderDevices(devices) {
  const map = {};
  devices.forEach(d => { map[d.id] = d; });

  const currentIds = new Set(devices.map(d => d.id));

  prevIds.forEach(id => {
    if (!currentIds.has(id)) addLog('用电器 ' + id + ' 停止使用');
  });
  currentIds.forEach(id => {
    if (!prevIds.has(id)) addLog('用电器 ' + id + ' 开始使用');
  });
  prevIds = currentIds;

  deviceGrid.innerHTML = '';
  for (let id = 1; id <= MAX_SLOTS; id++) {
    const d = map[id];
    const card = document.createElement('div');
    card.className = 'card' + (d ? '' : ' inactive');
    card.innerHTML = `
      <h3>用电器 ${id}</h3>
      <div class="row"><span>电流</span><span>${d ? d.i : '—'}</span></div>
      <div class="row"><span>电压</span><span>${d ? d.v : '—'}</span></div>
      <div class="row"><span>功率</span><span>${d ? d.p : '—'}</span></div>
      <div class="row"><span>相位</span><span>${d ? d.phase : '—'}</span></div>
    `;
    deviceGrid.appendChild(card);
  }
}

function renderLearned(list) {
  if (!list.length) {
    learnedList.textContent = '（暂无）';
  } else {
    learnedList.textContent = '编号: ' + list.join(', ');
  }
}

function sendCtrl(obj) {
  const msg = JSON.stringify(obj);
  client.publish(topicCtrl, msg, { qos: 0 });
  addLog('发送控制: ' + msg);
}

function addLog(text) {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.textContent = '[' + time + '] ' + text;
  logBox.prepend(div);
  while (logBox.children.length > 200) logBox.removeChild(logBox.lastChild);
}
</script>

</body>
</html>
